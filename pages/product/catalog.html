<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Danh mục sản phẩm tôn thép xây dựng HMP — Tôn sóng lợp mái, tôn xốp PU, phụ kiện tôn chính hãng, cắt theo yêu cầu">
  <title>Danh Mục Sản Phẩm — HMP Tôn Thép</title>

  <!-- CSS Lớp Nền tảng (Base) -->
  <link rel="stylesheet" href="../../assets/css/base/variables.css">
  <link rel="stylesheet" href="../../assets/css/base/reset.css">
  <link rel="stylesheet" href="../../assets/css/base/global.css">

  <!-- CSS Thành phần Dùng chung (Components) -->
  <link rel="stylesheet" href="../../assets/css/components/button.css">
  <link rel="stylesheet" href="../../assets/css/components/header.css">
  <link rel="stylesheet" href="../../assets/css/components/footer.css">

  <!-- CSS Riêng cho Trang Danh Mục Sản Phẩm (Pages) -->
  <link rel="stylesheet" href="../../assets/css/pages/catalog.css">
</head>
<body>

  <!-- ==================== HEADER CHÍNH (Nhúng đồng bộ từ Component) ==================== -->
  <div id="site-header" data-component="header"></div>

  <!-- ==================== NỘI DUNG CHÍNH ==================== -->
  <main class="main-content">
    <div class="container">

      <!-- 1. BANNER TRANG DANH MỤC CHUẨN MẪU THAM KHẢO -->
      <section class="catalog-banner">
        <div class="catalog-banner__inner">
          <div class="catalog-banner__content">
            <h1 class="catalog-banner__title">Sản phẩm</h1>
            <nav class="catalog-banner__breadcrumb" aria-label="Breadcrumb">
              <a href="../../index.html" class="catalog-banner__link">Trang chủ</a>
              <span class="catalog-banner__separator">&gt;</span>
              <span class="catalog-banner__current" id="banner-current-cat">Sản phẩm</span>
            </nav>
          </div>
          <!-- Ảnh banner sản phẩm -->
          <div class="catalog-banner__image-wrap">
            <img src="../../assets/images/product/banner-product.png" alt="Tôn sóng xây dựng HMP" class="catalog-banner__img">
          </div>
        </div>
      </section>

      <!-- 2. BỐ CỤC 2 CỘT: CÂY DANH MỤC BÊN TRÁI + LƯỚI SẢN PHẨM BÊN PHẢI -->
      <div class="catalog-layout">

        <!-- CỘT 1: SIDEBAR CÂY DANH MỤC ĐỘNG -->
        <aside class="catalog-sidebar">
          <div class="catalog-sidebar__header">
            <h2 class="catalog-sidebar__title">Danh mục</h2>
          </div>
          <div class="catalog-sidebar__body">
            <ul id="cat-tree-list" class="cat-tree">
              <!-- Mục: Tất cả sản phẩm -->
              <li class="cat-tree__item">
                <button type="button" class="cat-tree__parent-btn cat-tree__parent-btn--active" id="btn-cat-all" data-cat-id="">
                  <span class="cat-tree__parent-name">Tất cả sản phẩm</span>
                </button>
              </li>
              <!-- Các danh mục cha/con động sẽ được render bằng JS qua template -->
            </ul>
          </div>
        </aside>

        <!-- CỘT 2: NỘI DUNG LƯỚI SẢN PHẨM -->
        <section class="catalog-content">

          <!-- Thanh công cụ: Sắp xếp & Chế độ xem -->
          <div class="catalog-toolbar">
            <div class="catalog-sort">
              <label for="sort-select" class="catalog-sort__label">Sắp xếp:</label>
              <select id="sort-select" class="catalog-sort__select">
                <option value="createdAt,asc">Mặc định</option>
                <option value="productName,asc">Tên A → Z</option>
                <option value="productName,desc">Tên Z → A</option>
                <option value="createdAt,desc">Mới nhất</option>
              </select>
            </div>

            <!-- Chuyển đổi hiển thị (Grid / List) -->
            <div class="catalog-view-toggle">
              <button type="button" class="catalog-view-btn catalog-view-btn--active" title="Xem dạng lưới" aria-label="Xem dạng lưới">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="7" height="7"></rect>
                  <rect x="14" y="3" width="7" height="7"></rect>
                  <rect x="14" y="14" width="7" height="7"></rect>
                  <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
              </button>
              <button type="button" class="catalog-view-btn" title="Xem dạng danh sách" aria-label="Xem dạng danh sách">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="8" y1="6" x2="21" y2="6"></line>
                  <line x1="8" y1="12" x2="21" y2="12"></line>
                  <line x1="8" y1="18" x2="21" y2="18"></line>
                  <line x1="3" y1="6" x2="3.01" y2="6"></line>
                  <line x1="3" y1="12" x2="3.01" y2="12"></line>
                  <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Lưới hiển thị danh sách sản phẩm -->
          <div id="catalog-products-list" class="catalog-grid">
            <!-- Render động bằng JS qua thẻ <template id="catalog-card-template"> -->
          </div>

          <!-- Thanh phân trang bên dưới -->
          <nav id="catalog-pagination-wrap" class="catalog-pagination" aria-label="Phân trang sản phẩm">
            <!-- Nút trang render động -->
          </nav>

        </section>

      </div>

    </div>
  </main>

  <!-- ==================== FOOTER CHUẨN MẪU (Nhúng đồng bộ từ Component) ==================== -->
  <div id="site-footer" data-component="footer"></div>

  <!-- ==================== CÁC THẺ <template> TÁCH BIỆT DỮ LIỆU VÀ GIAO DIỆN ==================== -->
  <!-- Template 1: Danh mục cha trong Sidebar -->
  <template id="cat-parent-template">
    <li class="cat-tree__item">
      <button type="button" class="cat-tree__parent-btn">
        <span class="cat-tree__parent-name"></span>
        <span class="cat-tree__toggle-icon" title="Đóng/Mở nhánh con">
          <svg class="cat-tree__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </button>
      <ul class="cat-tree__children">
        <!-- Render danh mục con đệ quy -->
      </ul>
    </li>
  </template>

  <!-- Template 2: Danh mục lá (không có con) -->
  <template id="cat-child-template">
    <li class="cat-tree__item">
      <button type="button" class="cat-tree__child-btn">
        <span class="cat-tree__child-bullet">•</span>
        <span class="cat-tree__child-name"></span>
      </button>
    </li>
  </template>

  <!-- Template 3: Thẻ sản phẩm chuẩn mẫu tham khảo -->
  <template id="catalog-card-template">
    <article class="catalog-card">
      <div class="catalog-card__image-wrap">
        <img class="catalog-card__img" src="" alt="" loading="lazy">
      </div>
      <div class="catalog-card__body">
        <h3 class="catalog-card__title">
          <a class="catalog-card__link" href=""></a>
        </h3>
        <p class="catalog-card__spec"></p>
        <div class="catalog-card__footer">
          <a class="catalog-card__action-btn" href="">Liên hệ</a>
        </div>
      </div>
    </article>
  </template>

  <!-- Template 4: Trạng thái đang tải (Loading) -->
  <template id="catalog-loading-template">
    <div class="state-box state-box--full-width">
      <div class="state-box__spinner"></div>
      <h4 class="state-box__title">Đang tải sản phẩm tôn thép...</h4>
      <p class="state-box__desc">Kết nối dữ liệu từ máy chủ HMP</p>
    </div>
  </template>

  <!-- Template 5: Trạng thái danh sách rỗng (Empty) -->
  <template id="catalog-empty-template">
    <div class="state-box state-box--full-width">
      <h4 class="state-box__title">Chưa có sản phẩm nào trong danh mục này</h4>
      <p class="state-box__desc">Vui lòng chọn danh mục khác hoặc quay lại sau</p>
    </div>
  </template>

  <!-- Template 6: Trạng thái lỗi kết nối (Error) -->
  <template id="catalog-error-template">
    <div class="state-box state-box--full-width">
      <h4 class="state-box__title state-box__title--danger">Không thể kết nối đến máy chủ</h4>
      <p class="state-box__desc catalog-error-msg">Lỗi mạng khi tải dữ liệu</p>
    </div>
  </template>

  <!-- Template 7: Nút phân trang -->
  <template id="pagination-btn-template">
    <button type="button" class="pagination-btn"></button>
  </template>

  <!-- Template 8: Mục liên kết danh mục thả xuống (Header Dropdown) -->
  <template id="nav-dropdown-item-template">
    <a class="nav__dropdown-link">
      <span class="nav__dropdown-name"></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </a>
  </template>

  <!-- Script Điều Khiển Trang Danh Mục -->
  <script type="module" src="../../js/pages/product-catalog.js"></script>
</body>
</html>
